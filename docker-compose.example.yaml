services:
  database:
    image: bitnami/mariadb:latest
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_USER: dlrgdienstplan-dev
      MARIADB_PASSWORD: password
      MARIADB_DATABASE: dlrgdienstplan-dev
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MARIADB_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"
        ]
      timeout: 20s
      retries: 10
      interval: 3s
      start_period: 10s

  dienstplan:
    build:
      context: .
      args:
        CUSTOM_CA_CERT_B64: ${CUSTOM_CA_CERT_B64-}
        HTTP_PROXY: ${HTTP_PROXY-}
        HTTPS_PROXY: ${HTTPS_PROXY-}
        NO_PROXY: ${NO_PROXY-}
    ports: 
      - "80:8000"
      - "443:443"
    environment:
      DB_HOST: database
      DB_DATABASE: dlrgdienstplan-dev
      DB_USERNAME: dlrgdienstplan-dev
      DB_PASSWORD: password
      MAIL_DRIVER: smtp
      MAIL_MAILER: smtp
      MAIL_HOST: 
      MAIL_PORT: 
      MAIL_USERNAME: 
      MAIL_PASSWORD: 
      MAIL_FROM_ADDRESS: hello@example.com
      MAIL_FROM_NAME: Example
      MAIL_ENCRYPTION: tls
      APP_KEY: 
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 
      APP_ENV: local
      APP_DEBUG: true
      APP_LOG_LEVEL: debug
      TELESCOPE_ENABLED: false
      IS_DEMO: true
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      CACHE_DRIVER: redis
      QUEUE_DRIVER: sync

    volumes:
      - type: bind
        source: ./.env.docker
        target: /var/www/DienstplanDLRG/.env
      - type: bind
        source: ./app
        target: /var/www/DienstplanDLRG/app
      - type: bind
        source: ./resources
        target: /var/www/DienstplanDLRG/resources
      - type: bind
        source: ./database
        target: /var/www/DienstplanDLRG/database
      - type: bind
        source: ./config
        target: /var/www/DienstplanDLRG/config
      - type: bind
        source: ./public
        target: /var/www/DienstplanDLRG/public
      - type: bind
        source: ./routes
        target: /var/www/DienstplanDLRG/routes
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    environment:
      REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 20
      interval: 3s
      start_period: 5s
    # volumes:
    #   - type: bind
    #     source: ./redis.conf
    #     target: /usr/local/etc/redis/redis.conf
    # command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
  
volumes:
  db_data:
